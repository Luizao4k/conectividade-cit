[project]
name = "conectividade"
version = "0.1.0"
description = "Consulta ao portal Conectividade na Educação por código INEP."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_generics = true
python_version = "3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
